# Build image → đẩy GHCR → SSH vào VPS chạy blue-green (/opt/datviet/bin/deploy.sh). Thay cho Jenkins.
#   push staging → deploy staging | push main → deploy prod | PR vào staging/main → chỉ build để kiểm tra
#   Chạy tay (tab Actions → Build & Deploy → Run workflow, chọn nhánh staging/main):
#     deploy + tag cũ  → triển khai lại đúng tag đó (tag = 7 ký tự đầu commit)
#     rollback         → quay về màu trước, vài giây
# Secrets cần có: GHCR_USER, GHCR_TOKEN, VPS_HOST, VPS_SSH_KEY, VPS_KNOWN_HOSTS, FE_ENV
name: Build & Deploy

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]
  workflow_dispatch:
    inputs:
      action:
        description: "deploy = triển khai; rollback = quay về bản trước"
        type: choice
        options: [deploy, rollback]
        default: deploy
      tag:
        description: "Tag cần deploy (7 ký tự commit). Để trống = build commit hiện tại"
        required: false

# Merge liền nhau thì chạy lần lượt; PR mới thì hủy lượt build cũ
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/trongvu2003/dvg-fe
  SERVICE: fe

jobs:
  build:
    if: github.event_name != 'workflow_dispatch' || (inputs.action == 'deploy' && inputs.tag == '')
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - id: meta
        run: |
          echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_NAME" = main ]; then echo "channel=latest"; else echo "channel=staging"; fi >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USER }}
          password: ${{ secrets.GHCR_TOKEN }}

      # VITE_FIREBASE_* được nhúng vào code lúc build (VITE_API_URL mặc định /api trong Dockerfile)
      - env:
          FE_ENV: ${{ secrets.FE_ENV }}
        run: printf '%s\n' "$FE_ENV" > .env

      # Cache layer trên GitHub: package-lock.json không đổi thì không cài lại node_modules
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE }}:${{ steps.meta.outputs.channel }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    if: >-
      always()
      && github.event_name != 'pull_request'
      && (github.ref_name == 'main' || github.ref_name == 'staging')
      && (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - id: cmd
        env:
          ACTION: ${{ inputs.action || 'deploy' }}
          INPUT_TAG: ${{ inputs.tag }}
          BUILT_TAG: ${{ needs.build.outputs.tag }}
        run: |
          if [ "$GITHUB_REF_NAME" = main ]; then ENV_NAME=prod; else ENV_NAME=staging; fi
          if [ "$ACTION" = rollback ]; then
            echo "cmd=rollback $ENV_NAME $SERVICE" >> "$GITHUB_OUTPUT"
          else
            echo "cmd=deploy $ENV_NAME $SERVICE ${INPUT_TAG:-$BUILT_TAG}" >> "$GITHUB_OUTPUT"
          fi

      # Khóa này trên VPS chỉ chạy được /opt/datviet/bin/deploy-gate.sh (không mở được shell)
      - name: Deploy qua SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          HOST: ${{ secrets.VPS_HOST }}
          CMD: ${{ steps.cmd.outputs.cmd }}
        run: |
          install -m 700 -d ~/.ssh
          # VPS_SSH_KEY: base64 một dòng (khuyên dùng) hoặc nguyên khối -----BEGIN ... END-----
          if printf '%s' "$SSH_KEY" | grep -q 'BEGIN OPENSSH PRIVATE KEY'; then
            printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          else
            printf '%s' "$SSH_KEY" | tr -d '\r\n ' | base64 -d > ~/.ssh/id_ed25519
          fi
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 > /dev/null || {
            echo "::error::VPS_SSH_KEY không đọc được (có dòng BEGIN: $(grep -c "BEGIN OPENSSH" ~/.ssh/id_ed25519), số dòng: $(wc -l < ~/.ssh/id_ed25519))"
            exit 1
          }
          printf '%s\n' "$KNOWN_HOSTS" | tr -d '\r' > ~/.ssh/known_hosts
          echo "→ $CMD"
          ssh -o BatchMode=yes "deploy@$HOST" "$CMD"
